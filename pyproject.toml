[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnanet-geometry-repro"
version = "2.3.0"
description = "RNANet: multiscale RNA geometric descriptors (CY-A, CY-C, SURF) and analysis workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","biopython>=1.81","openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
